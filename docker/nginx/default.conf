server {
    listen 80;
    server_name _;
    root /var/www/plans/public;
    index index.php;

    client_max_body_size 128M;

    location = /__dev/reload {
        proxy_pass http://dev-reload:35729/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }
}

server {
    listen 8080;
    server_name _;
    root /var/www/api/public;
    index index.php;

    client_max_body_size 128M;

    location ^~ /uploads/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        location ~* \.(php|phtml|phar)$ {
            deny all;
        }

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_index index.php;
    }
}

server {
    listen 8082;
    server_name _;
    root /var/www/web/public;
    index index.php;

    client_max_body_size 128M;

    location = /__dev/reload {
        proxy_pass http://dev-reload:35729/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /__vite_hmr {
        proxy_pass http://store:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ^~ /uploads/ {
        alias /var/www/api/public/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        location ~* \.(php|phtml|phar)$ {
            deny all;
        }
    }

    location ^~ /assets/ {
        alias /var/www/api/public/assets/;

        location ~* \.(php|phtml|phar)$ {
            deny all;
        }
    }

    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
    }

    # Vite modules and HMR are served on the same origin. This keeps local
    # development working while allowing Cloudflare to proxy HTTPS/WSS.
    location ~ ^/(?:@vite|@id|@fs|src|node_modules)/ {
        proxy_pass http://store:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
