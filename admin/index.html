<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Borz33 Admin" />
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="icon" href="/admin/pwa-icon.svg" type="image/svg+xml" />
    <title>Borz33 Админ</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('borz33-admin-theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <script type="module">
      if (import.meta.env.DEV) {
        const source = new EventSource('/__dev/reload');
        source.addEventListener('reload', () => window.location.reload());
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
