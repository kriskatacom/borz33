services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      MAIL_DSN: ${MAIL_DSN}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      ORDER_ADMIN_EMAIL: ${ORDER_ADMIN_EMAIL:-}
      MAIL_VERIFICATION_TTL_MINUTES: ${MAIL_VERIFICATION_TTL_MINUTES}
      COMPANY_NAME: ${COMPANY_NAME}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME}
      COMPANY_EIK: ${COMPANY_EIK}
      COMPANY_VAT: ${COMPANY_VAT}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS}
      COMPANY_CITY: ${COMPANY_CITY}
      COMPANY_POSTAL_CODE: ${COMPANY_POSTAL_CODE}
      COMPANY_COUNTRY: ${COMPANY_COUNTRY}
      COMPANY_PHONE: ${COMPANY_PHONE}
      COMPANY_EMAIL: ${COMPANY_EMAIL}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE}
      COMPANY_PRIVACY_URL: ${COMPANY_PRIVACY_URL}
      COMPANY_TERMS_URL: ${COMPANY_TERMS_URL}
      ECONT_ENVIRONMENT: ${ECONT_ENVIRONMENT}
      ECONT_DEMO_API_BASE_URL: ${ECONT_DEMO_API_BASE_URL:-${ECONT_API_BASE_URL:-}}
      ECONT_PRODUCTION_API_BASE_URL: ${ECONT_PRODUCTION_API_BASE_URL:-}
      ECONT_CALCULATE_PATH: ${ECONT_CALCULATE_PATH}
      ECONT_CONNECTION_TEST_PATH: ${ECONT_CONNECTION_TEST_PATH:-Profile/ProfileService.getClientProfiles.json}
      ECONT_DEMO_OFFICE_LOCATOR_URL: ${ECONT_DEMO_OFFICE_LOCATOR_URL:-${ECONT_OFFICE_LOCATOR_URL:-}}
      ECONT_PRODUCTION_OFFICE_LOCATOR_URL: ${ECONT_PRODUCTION_OFFICE_LOCATOR_URL:-}
      ECONT_DEMO_USERNAME: ${ECONT_DEMO_USERNAME:-${ECONT_USERNAME:-}}
      ECONT_DEMO_PASSWORD: ${ECONT_DEMO_PASSWORD:-${ECONT_PASSWORD:-}}
      ECONT_TRACKING_URL: ${ECONT_TRACKING_URL:-https://ee.econt.com/load_direct.php}
      ECONT_TIMEOUT_SECONDS: ${ECONT_TIMEOUT_SECONDS}
      ECONT_CURRENCY: ${ECONT_CURRENCY}
      ECONT_SENDER_NAME: ${ECONT_SENDER_NAME}
      ECONT_SENDER_AGENT: ${ECONT_SENDER_AGENT}
      ECONT_SENDER_PHONE: ${ECONT_SENDER_PHONE}
      ECONT_SENDER_OFFICE_CODE: ${ECONT_SENDER_OFFICE_CODE}
      ECONT_SENDER_CITY: ${ECONT_SENDER_CITY}
      ECONT_SENDER_POST_CODE: ${ECONT_SENDER_POST_CODE}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_ASSISTANT_ENABLED: ${ADMIN_ASSISTANT_ENABLED:-true}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      OPENAI_PRODUCT_MODEL: ${OPENAI_PRODUCT_MODEL:-gpt-4.1-mini}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      AUTH_MAX_ATTEMPTS: ${AUTH_MAX_ATTEMPTS}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES}
      AUTH_IP_MAX_ATTEMPTS: ${AUTH_IP_MAX_ATTEMPTS}
      AUTH_DEVICE_CODE_TTL_MINUTES: ${AUTH_DEVICE_CODE_TTL_MINUTES}
      AUTH_DEVICE_CODE_MAX_ATTEMPTS: ${AUTH_DEVICE_CODE_MAX_ATTEMPTS}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost:3000}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:4000}
      STORE_VITE_DEV_URL: ${STORE_VITE_DEV_URL:-http://localhost:4000}
      STORE_VITE_PUBLIC_ORIGIN: ${STORE_VITE_PUBLIC_ORIGIN:-}
      DEV_RELOAD_ENABLED: ${DEV_RELOAD_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      HOST_UID: ${HOST_UID:-1000}
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/php/conf.d/development.ini:/usr/local/etc/php/conf.d/development.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PLANS_PORT:-2000}:80"
      - "${API_PORT:-5000}:8080"
      - "${WEB_PORT:-4000}:8082"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/api:ro
      - ./plans/public:/var/www/plans/public:ro
      - ./plans/views:/var/www/plans/views:ro
      - ./web:/var/www/web:ro
    depends_on:
      - php
      - dev-reload

  admin:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://nginx:8080
      VITE_ADMIN_ASSISTANT_ENABLED: ${ADMIN_ASSISTANT_ENABLED:-true}
    volumes:
      - ./admin:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - nginx
      - dev-reload

  store:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

  dev-reload:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: node /workspace/docker/dev-reload/server.mjs

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: unless-stopped
    environment:
      CLOUDFLARE_WEB_HOST: ${CLOUDFLARE_WEB_HOST:-}
      CLOUDFLARE_API_HOST: ${CLOUDFLARE_API_HOST:-}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-missing-token}
    depends_on:
      - nginx
      - store

volumes:
  mysql_data:
