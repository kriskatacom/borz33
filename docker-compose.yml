services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      MAIL_DSN: ${MAIL_DSN}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      ORDER_ADMIN_EMAIL: ${ORDER_ADMIN_EMAIL:-}
      MAIL_VERIFICATION_TTL_MINUTES: ${MAIL_VERIFICATION_TTL_MINUTES}
      COMPANY_NAME: ${COMPANY_NAME}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME}
      COMPANY_EIK: ${COMPANY_EIK}
      COMPANY_VAT: ${COMPANY_VAT}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS}
      COMPANY_CITY: ${COMPANY_CITY}
      COMPANY_POSTAL_CODE: ${COMPANY_POSTAL_CODE}
      COMPANY_COUNTRY: ${COMPANY_COUNTRY}
      COMPANY_PHONE: ${COMPANY_PHONE}
      COMPANY_EMAIL: ${COMPANY_EMAIL}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE}
      COMPANY_PRIVACY_URL: ${COMPANY_PRIVACY_URL}
      COMPANY_TERMS_URL: ${COMPANY_TERMS_URL}
      ECONT_ENVIRONMENT: ${ECONT_ENVIRONMENT}
      ECONT_API_BASE_URL: ${ECONT_API_BASE_URL}
      ECONT_CALCULATE_PATH: ${ECONT_CALCULATE_PATH}
      ECONT_OFFICE_LOCATOR_URL: ${ECONT_OFFICE_LOCATOR_URL}
      ECONT_USERNAME: ${ECONT_USERNAME}
      ECONT_PASSWORD: ${ECONT_PASSWORD}
      ECONT_TIMEOUT_SECONDS: ${ECONT_TIMEOUT_SECONDS}
      ECONT_CURRENCY: ${ECONT_CURRENCY}
      ECONT_SENDER_NAME: ${ECONT_SENDER_NAME}
      ECONT_SENDER_AGENT: ${ECONT_SENDER_AGENT}
      ECONT_SENDER_PHONE: ${ECONT_SENDER_PHONE}
      ECONT_SENDER_OFFICE_CODE: ${ECONT_SENDER_OFFICE_CODE}
      ECONT_SENDER_CITY: ${ECONT_SENDER_CITY}
      ECONT_SENDER_POST_CODE: ${ECONT_SENDER_POST_CODE}
      AUTH_MAX_ATTEMPTS: ${AUTH_MAX_ATTEMPTS}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES}
      AUTH_IP_MAX_ATTEMPTS: ${AUTH_IP_MAX_ATTEMPTS}
      AUTH_DEVICE_CODE_TTL_MINUTES: ${AUTH_DEVICE_CODE_TTL_MINUTES}
      AUTH_DEVICE_CODE_MAX_ATTEMPTS: ${AUTH_DEVICE_CODE_MAX_ATTEMPTS}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8082}
      STORE_VITE_DEV_URL: ${STORE_VITE_DEV_URL:-http://localhost:5174}
      STORE_VITE_PUBLIC_ORIGIN: ${STORE_VITE_PUBLIC_ORIGIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      HOST_UID: ${HOST_UID:-1000}
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PLANS_PORT:-8000}:80"
      - "${API_PORT:-8080}:8080"
      - "${WEB_PORT:-8082}:8082"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/api:ro
      - ./plans/public:/var/www/plans/public:ro
      - ./plans/views:/var/www/plans/views:ro
      - ./web:/var/www/web:ro
    depends_on:
      - php

  admin:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://nginx:8080
    volumes:
      - ./admin:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${ADMIN_PORT:-5173}:5173"
    depends_on:
      - nginx

  store:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "${STORE_VITE_PORT:-5174}:5174"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: unless-stopped
    environment:
      CLOUDFLARE_WEB_HOST: ${CLOUDFLARE_WEB_HOST:-}
      CLOUDFLARE_API_HOST: ${CLOUDFLARE_API_HOST:-}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-missing-token}
    depends_on:
      - nginx
      - store

volumes:
  mysql_data:
